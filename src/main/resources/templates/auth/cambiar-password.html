<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva contraseña</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="mb-3">Nueva contraseña</h4>
            <p class="text-muted small">
                Debe tener entre 8 y 11 caracteres con mayúscula, minúscula, número y carácter especial.
            </p>
            <div th:if="${error}" class="alert alert-danger small" th:text="${error}"></div>
            <form th:action="@{/recuperar/cambiar}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <input type="password" name="password" class="form-control mb-3" required
                       placeholder="Nueva contraseña" minlength="8" maxlength="11">
                <button class="btn btn-primary w-100">Cambiar contraseña</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
