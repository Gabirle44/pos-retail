<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - POS Retail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style> body{background:linear-gradient(135deg,#0d6efd,#6610f2);height:100vh;} </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="card shadow" style="width: 380px;">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <i class="bi bi-shop" style="font-size:3rem; color:#0d6efd;"></i>
            <h3 class="mt-2">POS Retail</h3>
            <p class="text-muted small mb-0">Iniciar sesión</p>
        </div>
        <div th:if="${param.error}" class="alert alert-danger small" th:text="${param.error}"></div>
        <div th:if="${param.logout}" class="alert alert-success small">Sesión cerrada correctamente.</div>
        <div th:if="${param.reset}" class="alert alert-success small">Contraseña actualizada. Ya puedes ingresar.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
        <div class="text-center mt-3">
            <a th:href="@{/recuperar}" class="small">¿Olvidaste tu contraseña?</a>
        </div>
    </div>
</div>
</body>
</html>
