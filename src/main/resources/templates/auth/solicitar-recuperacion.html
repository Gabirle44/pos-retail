<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="mb-3">Recuperar contraseña</h4>
            <p class="text-muted small">Ingresa el correo asociado a tu cuenta y te enviaremos un enlace para restablecerla.</p>
            <div th:if="${ok}" class="alert alert-success small" th:text="${ok}"></div>
            <form th:action="@{/recuperar}" method="post">
                <input type="email" name="email" class="form-control mb-3" required placeholder="correo@ejemplo.com">
                <button class="btn btn-primary w-100">Enviar enlace</button>
            </form>
            <div class="text-center mt-3">
                <a th:href="@{/login}" class="small">Volver al login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
