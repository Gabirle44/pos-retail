<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'POS Retail'">POS Retail</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background:#f4f6f9; }
        .sidebar { min-height: 100vh; background:#212529; color:#fff; }
        .sidebar a { color:#cfd2d6; text-decoration:none; display:block; padding:.6rem 1rem; }
        .sidebar a:hover, .sidebar a.active { background:#0d6efd; color:#fff; }
        .brand { padding:1rem; border-bottom:1px solid #343a40; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar p-0" sec:authorize="isAuthenticated()">
            <div class="brand h5 mb-0"><i class="bi bi-shop"></i> POS Retail</div>
            <a th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a th:href="@{/ventas}"><i class="bi bi-cart-check"></i> Ventas</a>
            <a th:href="@{/ventas/nueva}"><i class="bi bi-plus-circle"></i> Nueva venta</a>
            <a th:href="@{/compras}"><i class="bi bi-truck"></i> Compras</a>
            <a th:href="@{/compras/nueva}"><i class="bi bi-plus-circle"></i> Nueva compra</a>
            <a th:href="@{/reportes/ventas}"><i class="bi bi-bar-chart"></i> Reporte ventas</a>
            <a th:href="@{/reportes/stock}"><i class="bi bi-box-seam"></i> Stock</a>
            <a th:href="@{/reportes/kardex}"><i class="bi bi-clipboard-data"></i> Kardex</a>
            <form th:action="@{/logout}" method="post" class="p-2 mt-3">
                <button class="btn btn-danger w-100"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </nav>
        <main th:classappend="${#authorization.expression('isAuthenticated()')} ? 'col-md-10' : 'col-12'"
              class="p-4">
            <div th:replace="${content}">Contenido aquí</div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
