<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - POS Retail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .sidebar { min-height:100vh; background:#212529; }
        .sidebar a { color:#cfd2d6; text-decoration:none; display:block; padding:.6rem 1rem; }
        .sidebar a:hover { background:#0d6efd; color:#fff; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar p-0">
            <div class="text-white p-3 border-bottom border-secondary"><i class="bi bi-shop"></i> POS Retail</div>
            <a th:href="@{/dashboard}" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a th:href="@{/ventas}"><i class="bi bi-cart-check"></i> Ventas</a>
            <a th:href="@{/ventas/nueva}"><i class="bi bi-plus-circle"></i> Nueva venta</a>
            <a th:href="@{/compras}"><i class="bi bi-truck"></i> Compras</a>
            <a th:href="@{/compras/nueva}"><i class="bi bi-plus-circle"></i> Nueva compra</a>
            <a th:href="@{/reportes/ventas}"><i class="bi bi-bar-chart"></i> Reporte ventas</a>
            <a th:href="@{/reportes/stock}"><i class="bi bi-box-seam"></i> Stock</a>
            <a th:href="@{/reportes/kardex}"><i class="bi bi-clipboard-data"></i> Kardex</a>
            <form th:action="@{/logout}" method="post" class="p-2 mt-3">
                <button class="btn btn-danger w-100"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </nav>
        <main class="col-md-10 p-4">
            <h3 class="mb-4">Panel de control</h3>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card text-bg-primary">
                        <div class="card-body">
                            <h6>Total ventas</h6>
                            <h2 th:text="${totalVentas}">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-bg-success">
                        <div class="card-body">
                            <h6>Total compras</h6>
                            <h2 th:text="${totalCompras}">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-bg-warning">
                        <div class="card-body">
                            <h6>Productos en catálogo</h6>
                            <h2 th:text="${totalProductos}">0</h2>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
