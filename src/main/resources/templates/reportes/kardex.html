<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kardex</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .sidebar { min-height:100vh; background:#212529; }
        .sidebar a { color:#cfd2d6; text-decoration:none; display:block; padding:.6rem 1rem; }
        .sidebar a:hover, .sidebar a.active { background:#0d6efd; color:#fff; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar p-0">
            <div class="text-white p-3 border-bottom border-secondary"><i class="bi bi-shop"></i> POS Retail</div>
            <a th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a th:href="@{/ventas}"><i class="bi bi-cart-check"></i> Ventas</a>
            <a th:href="@{/compras}"><i class="bi bi-truck"></i> Compras</a>
            <a th:href="@{/reportes/ventas}"><i class="bi bi-bar-chart"></i> Reporte ventas</a>
            <a th:href="@{/reportes/stock}"><i class="bi bi-box-seam"></i> Stock</a>
            <a th:href="@{/reportes/kardex}" class="active"><i class="bi bi-clipboard-data"></i> Kardex</a>
            <form th:action="@{/logout}" method="post" class="p-2 mt-3">
                <button class="btn btn-danger w-100"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </nav>
        <main class="col-md-10 p-4">
            <h3 class="mb-3">Movimientos de Kardex</h3>
            <div class="card">
                <div class="card-body">
                    <table class="table table-hover table-sm">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th><th>Fecha</th><th>Producto</th><th>Tipo</th>
                                <th class="text-end">Cantidad</th>
                                <th class="text-end">Stock anterior</th>
                                <th class="text-end">Stock nuevo</th>
                                <th class="text-end">Costo unit.</th>
                                <th>Referencia</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${movimientos}">
                                <td th:text="${m.id}"></td>
                                <td th:text="${#temporals.format(m.fecha,'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${m.producto.nombre}"></td>
                                <td>
                                    <span th:if="${m.tipoMovimiento == 'ENTRADA'}" class="badge bg-success" th:text="${m.tipoMovimiento}"></span>
                                    <span th:if="${m.tipoMovimiento == 'SALIDA'}" class="badge bg-primary" th:text="${m.tipoMovimiento}"></span>
                                    <span th:if="${m.tipoMovimiento == 'DEVOLUCION_COMPRA'}" class="badge bg-warning text-dark" th:text="${m.tipoMovimiento}"></span>
                                </td>
                                <td class="text-end" th:text="${m.cantidad}"></td>
                                <td class="text-end" th:text="${m.stockAnterior}"></td>
                                <td class="text-end fw-bold" th:text="${m.stockNuevo}"></td>
                                <td class="text-end" th:text="${'Q '+#numbers.formatDecimal(m.costoUnitario,1,2)}"></td>
                                <td th:text="${m.referencia}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(movimientos)}">
                                <td colspan="9" class="text-center text-muted">Sin movimientos</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
