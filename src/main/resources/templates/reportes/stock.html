<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Stock</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .sidebar { min-height:100vh; background:#212529; }
        .sidebar a { color:#cfd2d6; text-decoration:none; display:block; padding:.6rem 1rem; }
        .sidebar a:hover, .sidebar a.active { background:#0d6efd; color:#fff; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar p-0">
            <div class="text-white p-3 border-bottom border-secondary"><i class="bi bi-shop"></i> POS Retail</div>
            <a th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a th:href="@{/ventas}"><i class="bi bi-cart-check"></i> Ventas</a>
            <a th:href="@{/compras}"><i class="bi bi-truck"></i> Compras</a>
            <a th:href="@{/reportes/ventas}"><i class="bi bi-bar-chart"></i> Reporte ventas</a>
            <a th:href="@{/reportes/stock}" class="active"><i class="bi bi-box-seam"></i> Stock</a>
            <a th:href="@{/reportes/kardex}"><i class="bi bi-clipboard-data"></i> Kardex</a>
            <form th:action="@{/logout}" method="post" class="p-2 mt-3">
                <button class="btn btn-danger w-100"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </nav>
        <main class="col-md-10 p-4">
            <h3 class="mb-3">Stock actual</h3>
            <div class="card">
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Código</th><th>Producto</th><th>Categoría</th>
                                <th class="text-end">Precio compra</th>
                                <th class="text-end">Precio venta</th>
                                <th class="text-end">Stock actual</th>
                                <th class="text-end">Stock mínimo</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${productos}">
                                <td th:text="${p.codigo}"></td>
                                <td th:text="${p.nombre}"></td>
                                <td th:text="${p.categoria.nombre}"></td>
                                <td class="text-end" th:text="${'Q '+#numbers.formatDecimal(p.precioCompra,1,2)}"></td>
                                <td class="text-end" th:text="${'Q '+#numbers.formatDecimal(p.precioVenta,1,2)}"></td>
                                <td class="text-end fw-bold" th:text="${p.stockActual}"></td>
                                <td class="text-end" th:text="${p.stockMinimo}"></td>
                                <td>
                                    <span th:if="${p.stockActual le p.stockMinimo}" class="badge bg-danger">BAJO</span>
                                    <span th:if="${p.stockActual gt p.stockMinimo}" class="badge bg-success">OK</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
