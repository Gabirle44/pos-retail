<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte ventas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .sidebar { min-height:100vh; background:#212529; }
        .sidebar a { color:#cfd2d6; text-decoration:none; display:block; padding:.6rem 1rem; }
        .sidebar a:hover, .sidebar a.active { background:#0d6efd; color:#fff; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar p-0">
            <div class="text-white p-3 border-bottom border-secondary"><i class="bi bi-shop"></i> POS Retail</div>
            <a th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a th:href="@{/ventas}"><i class="bi bi-cart-check"></i> Ventas</a>
            <a th:href="@{/compras}"><i class="bi bi-truck"></i> Compras</a>
            <a th:href="@{/reportes/ventas}" class="active"><i class="bi bi-bar-chart"></i> Reporte ventas</a>
            <a th:href="@{/reportes/stock}"><i class="bi bi-box-seam"></i> Stock</a>
            <a th:href="@{/reportes/kardex}"><i class="bi bi-clipboard-data"></i> Kardex</a>
            <form th:action="@{/logout}" method="post" class="p-2 mt-3">
                <button class="btn btn-danger w-100"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </nav>
        <main class="col-md-10 p-4">
            <h3 class="mb-3">Reporte de ventas</h3>
            <div class="card">
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th><th>Fecha</th><th>Cliente</th>
                                <th>Tipo pago</th><th class="text-end">Subtotal</th>
                                <th class="text-end">IVA</th><th class="text-end">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="v : ${ventas}">
                                <td th:text="${v.id}"></td>
                                <td th:text="${#temporals.format(v.fecha,'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${v.cliente.nombre}"></td>
                                <td th:text="${v.tipoPago}"></td>
                                <td class="text-end" th:text="${'Q '+#numbers.formatDecimal(v.subtotal,1,2)}"></td>
                                <td class="text-end" th:text="${'Q '+#numbers.formatDecimal(v.iva,1,2)}"></td>
                                <td class="text-end" th:text="${'Q '+#numbers.formatDecimal(v.total,1,2)}"></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr class="table-light">
                                <th colspan="6" class="text-end">Total general:</th>
                                <th class="text-end text-primary fs-5"
                                    th:text="${'Q '+#numbers.formatDecimal(#aggregates.sum(ventas.![total]),1,2)}"></th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
