<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva venta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .sidebar { min-height:100vh; background:#212529; }
        .sidebar a { color:#cfd2d6; text-decoration:none; display:block; padding:.6rem 1rem; }
        .sidebar a:hover, .sidebar a.active { background:#0d6efd; color:#fff; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar p-0">
            <div class="text-white p-3 border-bottom border-secondary"><i class="bi bi-shop"></i> POS Retail</div>
            <a th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a th:href="@{/ventas}"><i class="bi bi-cart-check"></i> Ventas</a>
            <a th:href="@{/ventas/nueva}" class="active"><i class="bi bi-plus-circle"></i> Nueva venta</a>
            <a th:href="@{/compras}"><i class="bi bi-truck"></i> Compras</a>
            <a th:href="@{/compras/nueva}"><i class="bi bi-plus-circle"></i> Nueva compra</a>
            <a th:href="@{/reportes/ventas}"><i class="bi bi-bar-chart"></i> Reporte ventas</a>
            <a th:href="@{/reportes/stock}"><i class="bi bi-box-seam"></i> Stock</a>
            <a th:href="@{/reportes/kardex}"><i class="bi bi-clipboard-data"></i> Kardex</a>
            <form th:action="@{/logout}" method="post" class="p-2 mt-3">
                <button class="btn btn-danger w-100"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </nav>
        <main class="col-md-10 p-4">
            <h3 class="mb-3">Registrar nueva venta</h3>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/ventas/registrar}" method="post" id="frmVenta">
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-5">
                                <label class="form-label">Cliente</label>
                                <select name="idCliente" class="form-select" required>
                                    <option value="">-- Seleccione --</option>
                                    <option th:each="c : ${clientes}" th:value="${c.id}"
                                            th:text="|${c.nit} - ${c.nombre}|"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Tipo de pago</label>
                                <select name="tipoPago" class="form-select" required>
                                    <option value="CONTADO">CONTADO</option>
                                    <option value="CREDITO">CRÉDITO</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Método de pago</label>
                                <select name="metodoPago" class="form-select">
                                    <option value="EFECTIVO">EFECTIVO</option>
                                    <option value="TARJETA">TARJETA</option>
                                    <option value="TRANSFERENCIA">TRANSFERENCIA</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between">
                        <strong>Detalle de productos</strong>
                        <button type="button" class="btn btn-sm btn-success" onclick="agregarLinea()">
                            <i class="bi bi-plus"></i> Agregar línea
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <table class="table mb-0" id="tablaLineas">
                            <thead class="table-light">
                                <tr>
                                    <th>Producto</th><th>Cantidad</th><th>Precio</th>
                                    <th class="text-end">Subtotal</th><th></th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div class="card-footer text-end">
                        <span class="me-3">Subtotal: <strong id="subtotal">Q 0.00</strong></span>
                        <span class="me-3">IVA 12%: <strong id="iva">Q 0.00</strong></span>
                        <span>Total: <strong id="total" class="text-primary fs-5">Q 0.00</strong></span>
                    </div>
                </div>

                <button class="btn btn-primary"><i class="bi bi-check-circle"></i> Registrar venta</button>
                <a th:href="@{/ventas}" class="btn btn-secondary">Cancelar</a>
            </form>
        </main>
    </div>
</div>

<script th:inline="javascript">
    const productos = /*[[${productos}]]*/ [];
    let idx = 0;

    function agregarLinea() {
        const tbody = document.querySelector('#tablaLineas tbody');
        const tr = document.createElement('tr');
        let opts = '<option value="">-- Producto --</option>';
        productos.forEach(p => {
            opts += `<option value="${p.id}" data-precio="${p.precioVenta}" data-stock="${p.stockActual}">
                       ${p.codigo} - ${p.nombre} (stock: ${p.stockActual})</option>`;
        });
        tr.innerHTML = `
            <td><select name="productoId" class="form-select" required onchange="cargarPrecio(this)">${opts}</select></td>
            <td><input type="number" name="cantidad" class="form-control" min="1" value="1" required oninput="recalcular()"></td>
            <td><input type="number" name="precio" step="0.01" class="form-control" required oninput="recalcular()"></td>
            <td class="text-end subtotal-cell">Q 0.00</td>
            <td><button type="button" class="btn btn-sm btn-danger" onclick="this.closest('tr').remove(); recalcular()"><i class="bi bi-trash"></i></button></td>
        `;
        tbody.appendChild(tr);
    }

    function cargarPrecio(sel) {
        const opt = sel.options[sel.selectedIndex];
        const tr = sel.closest('tr');
        tr.querySelector('input[name=precio]').value = opt.dataset.precio || 0;
        recalcular();
    }

    function recalcular() {
        let subtotal = 0;
        document.querySelectorAll('#tablaLineas tbody tr').forEach(tr => {
            const cant = parseFloat(tr.querySelector('input[name=cantidad]').value) || 0;
            const prec = parseFloat(tr.querySelector('input[name=precio]').value) || 0;
            const sub = cant * prec;
            tr.querySelector('.subtotal-cell').textContent = 'Q ' + sub.toFixed(2);
            subtotal += sub;
        });
        const iva = subtotal * 0.12;
        document.getElementById('subtotal').textContent = 'Q ' + subtotal.toFixed(2);
        document.getElementById('iva').textContent = 'Q ' + iva.toFixed(2);
        document.getElementById('total').textContent = 'Q ' + (subtotal + iva).toFixed(2);
    }

    // Agregar una línea inicial
    agregarLinea();
</script>
</body>
</html>
