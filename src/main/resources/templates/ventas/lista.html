<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ventas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .sidebar { min-height:100vh; background:#212529; }
        .sidebar a { color:#cfd2d6; text-decoration:none; display:block; padding:.6rem 1rem; }
        .sidebar a:hover, .sidebar a.active { background:#0d6efd; color:#fff; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar p-0">
            <div class="text-white p-3 border-bottom border-secondary"><i class="bi bi-shop"></i> POS Retail</div>
            <a th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a th:href="@{/ventas}" class="active"><i class="bi bi-cart-check"></i> Ventas</a>
            <a th:href="@{/ventas/nueva}"><i class="bi bi-plus-circle"></i> Nueva venta</a>
            <a th:href="@{/compras}"><i class="bi bi-truck"></i> Compras</a>
            <a th:href="@{/compras/nueva}"><i class="bi bi-plus-circle"></i> Nueva compra</a>
            <a th:href="@{/reportes/ventas}"><i class="bi bi-bar-chart"></i> Reporte ventas</a>
            <a th:href="@{/reportes/stock}"><i class="bi bi-box-seam"></i> Stock</a>
            <a th:href="@{/reportes/kardex}"><i class="bi bi-clipboard-data"></i> Kardex</a>
            <form th:action="@{/logout}" method="post" class="p-2 mt-3">
                <button class="btn btn-danger w-100"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </nav>
        <main class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Listado de ventas</h3>
                <a th:href="@{/ventas/nueva}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nueva venta</a>
            </div>
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>#</th><th>Fecha</th><th>Cliente</th><th>Usuario</th>
                                <th>Tipo pago</th><th class="text-end">Total</th><th>Estado</th><th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="v : ${ventas}">
                                <td th:text="${v.id}"></td>
                                <td th:text="${#temporals.format(v.fecha,'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${v.cliente.nombre}"></td>
                                <td th:text="${v.usuario.username}"></td>
                                <td th:text="${v.tipoPago}"></td>
                                <td class="text-end" th:text="${'Q '+#numbers.formatDecimal(v.total,1,2)}"></td>
                                <td><span class="badge bg-success" th:text="${v.estado}"></span></td>
                                <td>
                                    <a th:href="@{|/ventas/${v.id}/comprobante|}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-receipt"></i> Comprobante
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(ventas)}">
                                <td colspan="8" class="text-center text-muted">No hay ventas registradas</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
