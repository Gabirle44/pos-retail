<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle compra</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .sidebar { min-height:100vh; background:#212529; }
        .sidebar a { color:#cfd2d6; text-decoration:none; display:block; padding:.6rem 1rem; }
        .sidebar a:hover { background:#0d6efd; color:#fff; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar p-0">
            <div class="text-white p-3 border-bottom border-secondary"><i class="bi bi-shop"></i> POS Retail</div>
            <a th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a th:href="@{/ventas}"><i class="bi bi-cart-check"></i> Ventas</a>
            <a th:href="@{/compras}"><i class="bi bi-truck"></i> Compras</a>
            <a th:href="@{/compras/nueva}"><i class="bi bi-plus-circle"></i> Nueva compra</a>
            <a th:href="@{/reportes/ventas}"><i class="bi bi-bar-chart"></i> Reporte ventas</a>
            <a th:href="@{/reportes/stock}"><i class="bi bi-box-seam"></i> Stock</a>
            <a th:href="@{/reportes/kardex}"><i class="bi bi-clipboard-data"></i> Kardex</a>
            <form th:action="@{/logout}" method="post" class="p-2 mt-3">
                <button class="btn btn-danger w-100"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </nav>
        <main class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Compra #<span th:text="${compra.id}"></span></h3>
                <div>
                    <a th:href="@{|/compras/${compra.id}/devolver|}" class="btn btn-warning">
                        <i class="bi bi-arrow-counterclockwise"></i> Registrar devolución
                    </a>
                    <a th:href="@{/compras}" class="btn btn-secondary">Volver</a>
                </div>
            </div>
            <div class="card mb-3">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <strong>Proveedor:</strong> <span th:text="${compra.proveedor.nombre}"></span><br>
                            <strong>NIT:</strong> <span th:text="${compra.proveedor.nit}"></span>
                        </div>
                        <div class="col-md-6 text-end">
                            <strong>Fecha:</strong> <span th:text="${#temporals.format(compra.fecha,'dd/MM/yyyy HH:mm')}"></span><br>
                            <strong>Tipo pago:</strong> <span th:text="${compra.tipoPago}"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-body">
                    <table class="table table-bordered">
                        <thead class="table-light">
                            <tr><th>Producto</th><th class="text-end">Cantidad</th>
                                <th class="text-end">Precio</th><th class="text-end">Subtotal</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="d : ${compra.detalles}">
                                <td th:text="|${d.producto.codigo} - ${d.producto.nombre}|"></td>
                                <td class="text-end" th:text="${d.cantidad}"></td>
                                <td class="text-end" th:text="${'Q '+#numbers.formatDecimal(d.precioUnitario,1,2)}"></td>
                                <td class="text-end" th:text="${'Q '+#numbers.formatDecimal(d.subtotal,1,2)}"></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr><th colspan="3" class="text-end">Subtotal</th>
                                <th class="text-end" th:text="${'Q '+#numbers.formatDecimal(compra.subtotal,1,2)}"></th></tr>
                            <tr><th colspan="3" class="text-end">IVA</th>
                                <th class="text-end" th:text="${'Q '+#numbers.formatDecimal(compra.iva,1,2)}"></th></tr>
                            <tr><th colspan="3" class="text-end fs-5">TOTAL</th>
                                <th class="text-end fs-5 text-primary"
                                    th:text="${'Q '+#numbers.formatDecimal(compra.total,1,2)}"></th></tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
