<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Devolución de compra</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .sidebar { min-height:100vh; background:#212529; }
        .sidebar a { color:#cfd2d6; text-decoration:none; display:block; padding:.6rem 1rem; }
        .sidebar a:hover { background:#0d6efd; color:#fff; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar p-0">
            <div class="text-white p-3 border-bottom border-secondary"><i class="bi bi-shop"></i> POS Retail</div>
            <a th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a th:href="@{/ventas}"><i class="bi bi-cart-check"></i> Ventas</a>
            <a th:href="@{/compras}"><i class="bi bi-truck"></i> Compras</a>
            <a th:href="@{/reportes/ventas}"><i class="bi bi-bar-chart"></i> Reporte ventas</a>
            <a th:href="@{/reportes/stock}"><i class="bi bi-box-seam"></i> Stock</a>
            <a th:href="@{/reportes/kardex}"><i class="bi bi-clipboard-data"></i> Kardex</a>
            <form th:action="@{/logout}" method="post" class="p-2 mt-3">
                <button class="btn btn-danger w-100"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </nav>
        <main class="col-md-10 p-4">
            <h3 class="mb-3">Devolución de la compra #<span th:text="${compra.id}"></span></h3>
            <p class="text-muted">Proveedor: <strong th:text="${compra.proveedor.nombre}"></strong></p>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{|/compras/${compra.id}/devolver|}" method="post">
                <div class="mb-3">
                    <label class="form-label">Motivo</label>
                    <input type="text" name="motivo" class="form-control" required placeholder="Ej. Producto en mal estado">
                </div>
                <div class="card mb-3">
                    <div class="card-header"><strong>Selecciona productos y cantidades a devolver</strong></div>
                    <div class="card-body p-0">
                        <table class="table mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Devolver</th><th>Producto</th>
                                    <th class="text-end">Cant. comprada</th>
                                    <th class="text-end">Precio</th>
                                    <th>Cant. a devolver</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="d : ${compra.detalles}">
                                    <td><input type="checkbox" class="form-check-input chk" onchange="toggleFila(this)"></td>
                                    <td th:text="|${d.producto.codigo} - ${d.producto.nombre}|"></td>
                                    <td class="text-end" th:text="${d.cantidad}"></td>
                                    <td class="text-end" th:text="${'Q '+#numbers.formatDecimal(d.precioUnitario,1,2)}"></td>
                                    <td>
                                        <input type="hidden" class="pid" th:value="${d.producto.id}">
                                        <input type="hidden" class="prec" th:value="${d.precioUnitario}">
                                        <input type="number" class="form-control form-control-sm cantInput"
                                               min="1" th:max="${d.cantidad}" disabled placeholder="0">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Inputs ocultos que llenará el JS al enviar -->
                <div id="hiddenInputs"></div>

                <button type="submit" class="btn btn-warning" onclick="prepararEnvio()">
                    <i class="bi bi-arrow-counterclockwise"></i> Registrar devolución
                </button>
                <a th:href="@{|/compras/${compra.id}|}" class="btn btn-secondary">Cancelar</a>
            </form>
        </main>
    </div>
</div>

<script>
function toggleFila(chk) {
    const input = chk.closest('tr').querySelector('.cantInput');
    input.disabled = !chk.checked;
    if (chk.checked) input.value = input.max;
    else input.value = '';
}
function prepararEnvio() {
    const cont = document.getElementById('hiddenInputs');
    cont.innerHTML = '';
    document.querySelectorAll('tbody tr').forEach(tr => {
        const chk = tr.querySelector('.chk');
        if (!chk.checked) return;
        const cant = tr.querySelector('.cantInput').value;
        if (!cant || cant <= 0) return;
        const pid = tr.querySelector('.pid').value;
        const prec = tr.querySelector('.prec').value;
        cont.innerHTML +=
            `<input type="hidden" name="productoId" value="${pid}">
             <input type="hidden" name="cantidad" value="${cant}">
             <input type="hidden" name="precio" value="${prec}">`;
    });
}
</script>
</body>
</html>
